name: ArenaFC CI

on:
  pull_request:
    branches: [ develop, main ]

jobs:
  build-and-test:
    runs-on: macos-15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.0
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Run tests
        run: |
          xcodebuild test \
            -scheme ArenaFC \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -enableCodeCoverage YES
